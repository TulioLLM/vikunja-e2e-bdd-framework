name: E2E Regression Suite

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Gherkin tag expression to run (e.g. @E2E, @smoke, @tasks)'
        required: true
        default: '@E2E'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      VIKUNJA_SERVICE_SECRET: ci-secret-key-32-bytes-long-12345

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static checks (lint, typecheck, format)
        run: npm run check

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start Vikunja and Postgres
        run: docker compose up -d

      - name: Wait for the API to respond
        run: npm run smoke-check

      - name: Dump container diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100 vikunja db

      - name: Generate BDD specs and run tests
        env:
          PLAYWRIGHT_TAGS: ${{ inputs.tags }}
        run: |
          npx bddgen
          npx playwright test --grep "$PLAYWRIGHT_TAGS"

      - name: Stop containers
        if: always()
        run: docker compose down -v

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload traces, videos and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
