name: E2E Regression Suite

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      VIKUNJA_SERVICE_SECRET: ci-secret-key-32-bytes-long-12345

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Instalación limpia de dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Levantar Vikunja y Postgres con Docker Compose
        run: docker compose up -d

      - name: Esperar a que la API responda
        run: npx tsx scripts/smoke-check.ts

      - name: Diagnosticar contenedores si falla el smoke check
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100 vikunja db

      - name: Generar especificaciones BDD y ejecutar tests
        run: |
          npx bddgen
          npx playwright test

      - name: Apagar contenedores Docker
        if: always()
        run: docker compose down -v

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
