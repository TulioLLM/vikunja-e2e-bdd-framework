name: E2E Regression Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: vikunja
          POSTGRES_PASSWORD: vikunjapassword
          POSTGRES_DB: vikunja
        options: >-
          --health-cmd "pg_isready -U vikunja"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

      vikunja:
        image: vikunja/vikunja:2.6.0
        env:
          VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:3456/
          VIKUNJA_SERVICE_ENABLEREGISTRATION: 'true'
          VIKUNJA_SERVICE_JWTSECRET: ci-secret-key-32-bytes-long-12345
          VIKUNJA_SERVICE_SECRET: ci-secret-key-32-bytes-long-12345
          VIKUNJA_DATABASE_HOST: db
          VIKUNJA_DATABASE_TYPE: postgres
          VIKUNJA_DATABASE_USER: vikunja
          VIKUNJA_DATABASE_PASSWORD: vikunjapassword
          VIKUNJA_DATABASE_DATABASE: vikunja
        ports:
          - 3456:3456

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Instalación limpia de dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Esperar a que la API responda
        run: npx tsx scripts/smoke-check.ts

      - name: Generar especificaciones BDD y ejecutar tests
        run: |
          npx bddgen
          npx playwright test

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
